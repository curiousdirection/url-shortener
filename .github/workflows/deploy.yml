# Deploys the app: build the zip and the page, apply infra/app, check /health.
# Then, if the page changed, uploads it.
# Starts when CI has passed on main; run it by hand with ref to roll back.
#
# The build job runs the npm packages on a GitHub-hosted runner, with no AWS credentials.
# The deploy job runs on a CodeBuild-hosted runner in our AWS account and gets its credentials from the deploy role (infra/bootstrap/runner.tf), so there are no access keys.
# The workflow must stay named "Deploy": that is what the runner's webhook filters on.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit to roll back to, a full or short SHA from main's history. It is built and deployed as it was."
        required: false
        type: string

# Read-only by default.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    # After CI passed on main (not a failed or cancelled run), or by hand.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      hash: ${{ steps.zip.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }} # the commit CI tested, or the one to roll back to
          fetch-depth: 0 # to compare with the deployed commit

      # A rollback may only deploy code that was merged, not a commit from another branch.
      - name: Check the rollback commit is on main
        if: inputs.ref != ''
        run: infra/scripts/check-on-main.sh

      # Everything npm runs is here, so it never runs where AWS credentials are available.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Build the zip
        id: zip
        run: echo "hash=$(infra/scripts/build-zip.sh)" >> "$GITHUB_OUTPUT"
      - run: npm run web:build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-zip
          path: build/app.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: build/web
          if-no-files-found: error

  # The function first, then the web page, so a new bucket or CDN setting is in place before the page goes up.
  deploy:
    needs: build
    # One deploy at a time.
    # A new one waits rather than cancelling a running apply; a newer one replaces one that is still waiting.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # The CodeBuild runner project (infra/bootstrap/runner.tf).
    runs-on: codebuild-url-shortener-deploy-${{ github.run_id }}-${{ github.run_attempt }}
    # For GitHub's deployment history only; the deploy role's trust policy and the workflow name are what limit who can deploy (docs/security.md).
    environment: production
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }} # the AWS CLI reads this one
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      ROLLBACK_TO: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # deploy-skip.sh compares with the deployed commit

      # The scripts and Terraform's setup need these, and the CodeBuild image is not the GitHub-hosted one.
      - name: Check the runner has its tools
        run: |
          for tool in aws curl git unzip; do
            command -v "$tool" >/dev/null || { echo "::error::The runner image has no $tool"; exit 1; }
          done

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-zip
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: build/web

      - uses: ./.github/actions/setup-terraform
        with:
          init: "true"

      - name: Skip the function if torn down or unchanged
        run: infra/scripts/deploy-skip.sh app

      - name: Plan and apply
        if: env.SKIP_APP == ''
        env:
          HASH: ${{ needs.build.outputs.hash }}
        run: infra/scripts/apply-app.sh "$HASH"

      - name: Check /health
        if: env.SKIP_APP == ''
        run: infra/scripts/check-live.sh app

      - name: Skip the page if torn down or unchanged
        run: infra/scripts/deploy-skip.sh web

      - name: Upload the page
        if: env.SKIP_WEB == ''
        run: infra/scripts/release-web.sh

      - name: Check the page is live
        if: env.SKIP_WEB == ''
        run: infra/scripts/check-live.sh web
