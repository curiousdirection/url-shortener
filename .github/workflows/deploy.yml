# Deploys the app on push to main: tests, build and push the image, apply infra/app.
# Only the app stack is applied here; the foundation is applied by a person.
# See "Deploy" in infra/README.md. Actions are pinned to commit SHAs (see ci.yml).
name: Deploy

on:
  push:
    branches: [main]
    # Only what goes into the image or the app stack. Docs or tests alone don't deploy.
    paths:
      - src/**
      - migrations/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - Dockerfile
      - .dockerignore
      - .node-version
      - .terraform-version
      - infra/app/**
      - infra/scripts/push-image.sh
      - .github/workflows/deploy.yml
      - .github/workflows/test.yml
      - .github/actions/setup-terraform/**
  workflow_dispatch:
    inputs:
      app_version:
        description: "Existing image tag to roll back to (the first 7 characters of the commit SHA). Skips the tests and the build."
        required: false
        type: string

# One deploy at a time. A new push waits rather than cancelling a running apply.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Read-only by default. Only the release job can get AWS credentials.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    if: inputs.app_version == '' # a rollback doesn't wait for the latest commit's tests
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    # After passing tests, or when they were skipped for a rollback.
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-24.04-arm # builds the arm64 image natively
    environment: production # only main can use it, and only it can assume the deploy role
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 45
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      ROLLBACK_TO: ${{ inputs.app_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-terraform

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init
        run: |
          : "${TF_STATE_BUCKET:?Set the TF_STATE_BUCKET repository variable}"
          terraform -chdir=infra/app init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"

      # CI only updates a running service. If the stack is torn down, stop green instead of
      # recreating it from a stray push.
      - name: Check that the app is deployed
        id: gate
        run: |
          if ! list="$(terraform -chdir=infra/app state list 2>err.txt)"; then
            grep -q "No state file was found" err.txt || { cat err.txt >&2; exit 1; }
            list=""
          fi
          if grep -qx 'aws_ecs_express_gateway_service.app' <<<"$list"; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "### Deploy skipped: the app is not deployed. Run \`infra/scripts/release.sh\` to bring it up." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Tag: the first 7 characters of the commit SHA, as in release.sh, so either can reuse the
      # other's image.
      - name: Build and push the image
        id: image
        if: steps.gate.outputs.deployed == 'true'
        run: |
          repo="$(terraform -chdir=infra/app output -raw ecr_repository_url)"
          sha="$(git rev-parse HEAD)"
          tag="${ROLLBACK_TO:-${sha:0:7}}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          infra/scripts/push-image.sh "$repo" "$tag" ${ROLLBACK_TO:+--no-build}

      # Apply exactly the saved plan. The apply waits for the release to go live; if Express
      # Mode's canary rolls it back, this step fails. -lock-timeout waits for a local release.sh.
      - name: Plan and apply
        if: steps.gate.outputs.deployed == 'true'
        env:
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          terraform -chdir=infra/app plan -input=false -lock-timeout=10m -no-color \
            -var "app_version=$TAG" -out=tfplan | tee plan.txt
          { echo '### Terraform plan'; echo '```'; head -c 900000 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          terraform -chdir=infra/app apply -input=false -lock-timeout=10m tfplan

      - name: Check /health
        if: steps.gate.outputs.deployed == 'true'
        env:
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          url="$(terraform -chdir=infra/app output -raw url)"
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors "$url/health"
          echo "### Deployed \`$TAG\` to $url${ROLLBACK_TO:+ (rollback)}" >> "$GITHUB_STEP_SUMMARY"
