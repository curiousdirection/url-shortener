# Deploys the app: build the zip, apply infra/app, check /health.
# Then, if the page changed, uploads it.
# Starts when CI has passed on main; run it by hand with ref to roll back.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit to roll back to, a full or short SHA from main's history. It is built and deployed as it was."
        required: false
        type: string

# Read-only by default.
# Only the release job can get AWS credentials.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release:
    # After CI passed on main (not a failed or cancelled run), or by hand.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # One deploy at a time.
    # A new one waits rather than cancelling a running apply; a newer one replaces one that is still waiting.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: production # only main can use it, so only main gets the deploy keys
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      ROLLBACK_TO: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }} # the commit CI tested, or the one to roll back to
          fetch-depth: 0 # to compare with the deployed commit

      # A rollback may only deploy code that was merged, not a commit from another branch.
      - name: Check the rollback commit is on main
        if: inputs.ref != ''
        run: infra/scripts/check-on-main.sh

      # The zip is built before signing in to AWS, so the npm packages never run with credentials.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Build the zip
        id: zip
        run: echo "hash=$(infra/scripts/build-zip.sh)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-terraform
        with:
          role: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          access-key-id: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}

      - name: Skip if torn down or unchanged
        run: infra/scripts/deploy-skip.sh app

      - name: Plan and apply
        if: env.SKIP == ''
        env:
          HASH: ${{ steps.zip.outputs.hash }}
        run: infra/scripts/apply-app.sh "$HASH"

      - name: Check /health
        if: env.SKIP == ''
        run: infra/scripts/check-live.sh app

  # The web page deploys apart from the function, after it, so a new bucket or CDN setting is in place first.
  web:
    needs: release
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      ROLLBACK_TO: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Check the rollback commit is on main
        if: inputs.ref != ''
        run: infra/scripts/check-on-main.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run web:build

      - uses: ./.github/actions/setup-terraform
        with:
          role: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          access-key-id: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}

      - name: Skip if torn down or unchanged
        run: infra/scripts/deploy-skip.sh web

      - name: Upload the page
        if: env.SKIP == ''
        run: infra/scripts/release-web.sh

      - name: Check the page is live
        if: env.SKIP == ''
        run: infra/scripts/check-live.sh web
