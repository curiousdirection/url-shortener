# Checks every push to every branch: tests and build (test.yml), Terraform checks (terraform.yml).
# On main, the checks are followed by the deploy: build the zip and the page, apply infra/app, check /health.
# Then, if the page changed, it uploads it.
# Run it by hand with ref to roll back.
#
# The build job runs the npm packages on a GitHub-hosted runner, with no AWS credentials.
# The deploy job runs on a CodeBuild-hosted runner in our AWS account and gets its credentials from the deploy role (infra/bootstrap/runner.tf), so there are no access keys.
# The workflow must stay named "CI": that is what the runner's webhook filters on.
# If the deploy job never starts, the watchdog job cancels the run.
#
# All workflows pin actions to commit SHAs.
# To update one, change the SHA and the version comment together:
#   git ls-remote https://github.com/<owner>/<action> 'refs/tags/<tag>*'
name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit to roll back to, a full or short SHA from main's history. It is built and deployed as it was, without the checks."
        required: false
        type: string

permissions:
  contents: read

# One run per ref.
# A new push to a branch cancels the run in progress.
# On main, runs queue instead, so an apply is never cancelled and deploys go in the order they were triggered; a newer waiting run replaces an older one that is still waiting.
# A rollback started on main joins the same queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    if: inputs.ref == ''
    uses: ./.github/workflows/test.yml

  # Terraform formatting and validate (terraform.yml).
  terraform:
    if: inputs.ref == ''
    uses: ./.github/workflows/terraform.yml

  # The three jobs below run only on main, after the checks passed.
  # A rollback skips the checks, so a broken main can't block it: that commit was tested when it was merged.
  # `watchdog` and `deploy` need `build`, so they are skipped with it.
  build:
    needs: [test, terraform]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (inputs.ref != '' || (needs.test.result == 'success' && needs.terraform.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      hash: ${{ steps.zip.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }} # the commit pushed, or the one to roll back to
          fetch-depth: 0 # check-on-main.sh needs main's history for a rollback

      # A rollback may only deploy code that was merged, not a commit from another branch.
      - name: Check the rollback commit is on main
        if: inputs.ref != ''
        run: infra/scripts/check-on-main.sh

      # Everything npm runs is here, so it never runs where AWS credentials are available.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Build the zip
        id: zip
        run: echo "hash=$(infra/scripts/build-zip.sh)" >> "$GITHUB_OUTPUT"
      - run: npm run web:build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-zip
          path: build/app.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: build/web
          if-no-files-found: error

  # timeout-minutes doesn't apply while a job waits for a runner, and GitHub gives up on it only after 24 hours.
  # So a deploy that CodeBuild never picks up (a lost webhook, a revoked connection, a filter that doesn't match) would hold the concurrency group and block every later deploy.
  # This cancels the run if the deploy job is still queued after 15 minutes.
  watchdog:
    needs: build
    # Without a status check, a job is skipped when any earlier job in the chain was, as test and terraform are on a rollback.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write # to cancel the run; only this job has it
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel the run if no runner picks up the deploy job
        run: |
          for _ in $(seq 30); do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --jq '.jobs[] | select(.name == "deploy") | .status')"
            # Empty or pending means the job isn't created or ready yet, so keep watching.
            case "$status" in in_progress | completed) exit 0 ;; esac
            sleep 30
          done
          echo "::error::No CodeBuild runner picked up the deploy job in 15 minutes. See \"If the deploy job never starts\" in infra/README.md."
          echo "### Deploy cancelled: no runner started within 15 minutes" >> "$GITHUB_STEP_SUMMARY"
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          sleep 60 # the cancellation ends this job too

  # The function first, then the web page, so a new bucket or CDN setting is in place before the page goes up.
  deploy:
    needs: build
    # Same status check as the watchdog's, for the same reason.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    # The CodeBuild runner project (infra/bootstrap/runner.tf).
    runs-on: codebuild-url-shortener-deploy-${{ github.run_id }}-${{ github.run_attempt }}
    environment: production
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      ROLLBACK_TO: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0 # deploy-skip.sh compares with the deployed commit

      # The scripts and Terraform's setup need these, and the CodeBuild image is not the GitHub-hosted one.
      - name: Check the runner has its tools
        run: |
          for tool in aws curl git unzip; do
            command -v "$tool" >/dev/null || { echo "::error::The runner image has no $tool"; exit 1; }
          done

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-zip
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: build/web

      - uses: ./.github/actions/setup-terraform
        with:
          init: "true"

      - name: Skip the function if torn down or unchanged
        run: infra/scripts/deploy-skip.sh app

      - name: Plan and apply
        if: env.SKIP_APP == ''
        env:
          HASH: ${{ needs.build.outputs.hash }}
        run: infra/scripts/apply-app.sh "$HASH"

      - name: Check /health
        if: env.SKIP_APP == ''
        run: infra/scripts/check-live.sh app

      - name: Skip the page if torn down or unchanged
        run: infra/scripts/deploy-skip.sh web

      - name: Upload the page
        if: env.SKIP_WEB == ''
        run: infra/scripts/release-web.sh

      - name: Check the page is live
        if: env.SKIP_WEB == ''
        run: infra/scripts/check-live.sh web
