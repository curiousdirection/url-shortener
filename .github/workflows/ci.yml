# Checks on every pull request and every push to main: tests, build and Terraform files, plus
# the app plan on pull requests. On main, when the checks pass and the app changed, it then
# deploys (deploy.yml). Actions are pinned to commit SHAs; update the SHA and the version
# comment together (`git ls-remote https://github.com/<owner>/<action> 'refs/tags/<tag>*'`).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request replaces its run in progress. On main every commit gets a run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    uses: ./.github/workflows/test.yml

  terraform-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-terraform
      - run: infra/scripts/check-terraform.sh

  # What would merging change in the app stack? Uses the read-only plan role. There is no
  # foundation plan: refreshing it would decrypt the database password. Forks get no AWS token.
  plan:
    if: github.event.pull_request.head.repo.full_name == github.repository && vars.AWS_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-terraform
        with:
          role: ${{ vars.AWS_PLAN_ROLE_ARN }}
      - run: |
          infra/scripts/plan-app.sh | tee plan.txt
          { echo '### Terraform plan: app'; echo '```'; head -c 900000 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # On main: did this push change anything that goes into the app? Docs or tests alone don't
  # deploy.
  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          app="$(infra/scripts/app-changed.sh "$BEFORE" "$GITHUB_SHA")"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          if [ "$app" = false ]; then echo "### No deploy: nothing in this push goes into the app." >> "$GITHUB_STEP_SUMMARY"; fi

  deploy:
    needs: [test, terraform-check, changes]
    if: needs.changes.outputs.app == 'true'
    permissions:
      contents: read
      id-token: write # passed on to deploy.yml's release job
    uses: ./.github/workflows/deploy.yml
