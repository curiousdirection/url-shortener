# Tests every push, and deploys main once the tests pass.
# All workflows pin actions to commit SHAs.
# To update one, change the SHA and the version comment together:
#   git ls-remote https://github.com/<owner>/<action> 'refs/tags/<tag>*'
# Renaming this workflow stops deploys: the runner only starts for a workflow named CI.
name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit to roll back to, a full or short SHA from main's history. It is built and deployed as it was, without the checks."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    if: inputs.ref == ''
    uses: ./.github/workflows/test.yml

  terraform:
    if: inputs.ref == ''
    uses: ./.github/workflows/terraform.yml

  lint:
    if: inputs.ref == ''
    uses: ./.github/workflows/lint.yml

  build:
    needs: [test, terraform, lint]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (inputs.ref != '' || (needs.test.result == 'success' && needs.terraform.result == 'success' && needs.lint.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      hash: ${{ steps.zip.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # A rollback may only deploy code that was merged, not a commit from another branch.
      - name: Check the rollback commit is on main
        if: inputs.ref != ''
        run: infra/scripts/check-on-main.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Build the zip
        id: zip
        run: echo "hash=$(infra/scripts/build-zip.sh)" >> "$GITHUB_OUTPUT"
      - run: npm run web:build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-zip
          path: build/app.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: build/web
          if-no-files-found: error

  watchdog:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel the run if no runner picks up the deploy job
        run: |
          for _ in $(seq 30); do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --jq '.jobs[] | select(.name == "deploy") | .status')"
            case "$status" in in_progress | completed) exit 0 ;; esac
            sleep 30
          done
          echo "::error::No CodeBuild runner picked up the deploy job in 15 minutes. See \"If the deploy job never starts\" in infra/README.md."
          echo "### Deploy cancelled: no runner started within 15 minutes" >> "$GITHUB_STEP_SUMMARY"
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          sleep 60

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: codebuild-url-shortener-deploy-${{ github.run_id }}-${{ github.run_attempt }}
    environment: production
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      ROLLBACK_TO: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the runner has its tools
        run: |
          for tool in aws curl git unzip; do
            command -v "$tool" >/dev/null || { echo "::error::The runner image has no $tool"; exit 1; }
          done

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-zip
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: build/web

      - uses: ./.github/actions/setup-terraform
        with:
          init: "true"

      - name: Skip the function if torn down or unchanged
        run: infra/scripts/deploy-skip.sh app

      - name: Plan and apply
        if: env.SKIP_APP == ''
        env:
          HASH: ${{ needs.build.outputs.hash }}
        run: infra/scripts/apply-app.sh "$HASH"

      - name: Check /health
        if: env.SKIP_APP == ''
        run: infra/scripts/check-live.sh app

      - name: Skip the page if torn down or unchanged
        run: infra/scripts/deploy-skip.sh web

      - name: Upload the page
        if: env.SKIP_WEB == ''
        run: infra/scripts/release-web.sh

      - name: Check the page is live
        if: env.SKIP_WEB == ''
        run: infra/scripts/check-live.sh web
