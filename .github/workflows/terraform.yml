# The Terraform checks: formatting and validate for all three stacks.
# They need no AWS credentials.
# Not run on its own: ci.yml calls it on every push.
name: Terraform

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-terraform
      - run: infra/scripts/check-terraform.sh
