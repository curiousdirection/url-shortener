# Installs the Terraform version in .terraform-version. With `role`, it also signs in to AWS
# with the IAM user's access key, assumes that role and runs `terraform init` for infra/app,
# using the job's AWS_REGION and TF_STATE_BUCKET. The key is an input because a composite
# action can't read secrets. Run actions/checkout first. Used by terraform.yml and deploy.yml.
name: Set up Terraform
description: Install Terraform; with a role, also sign in to AWS and init infra/app.

inputs:
  role:
    description: IAM role to assume. Leave empty to only install Terraform.
    required: false
    default: ""
  access-key-id:
    description: Access key ID of the IAM user that may assume the role. Needed with `role`.
    required: false
    default: ""
  secret-access-key:
    description: Secret access key for it. Needed with `role`.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ steps.version.outputs.version }}
        terraform_wrapper: false # `terraform output -raw` needs it off
    - if: inputs.role != ''
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        aws-access-key-id: ${{ inputs.access-key-id }}
        aws-secret-access-key: ${{ inputs.secret-access-key }}
        role-to-assume: ${{ inputs.role }}
        # Otherwise the action tags the session, and the trust would need sts:TagSession.
        role-skip-session-tagging: true
        aws-region: ${{ env.AWS_REGION }}
    - if: inputs.role != ''
      shell: bash
      run: |
        : "${TF_STATE_BUCKET:?Set the TF_STATE_BUCKET repository variable}"
        terraform -chdir=infra/app init -input=false \
          -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"
