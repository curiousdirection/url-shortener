# Installs the Terraform version in .terraform-version.
# Run actions/checkout first.
name: Set up Terraform
description: Install Terraform; with init, also init infra/app.

inputs:
  init:
    description: Set to "true" to also run terraform init for infra/app. Leave empty to only install Terraform.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ steps.version.outputs.version }}
        terraform_wrapper: false # `terraform output -raw` needs it off
    - if: inputs.init == 'true'
      shell: bash
      run: |
        : "${TF_STATE_BUCKET:?Set the TF_STATE_BUCKET repository variable}"
        terraform -chdir=infra/app init -input=false \
          -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"
