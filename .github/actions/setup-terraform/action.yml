# Installs the Terraform version in .terraform-version, so the version is written in one file
# and every workflow uses it. Used by ci.yml and deploy.yml.
#
# Run actions/checkout before this: it reads .terraform-version from the checkout.
#
# Pinned to a full commit SHA, with its version in the comment (see ci.yml).
name: Set up Terraform
description: Install the Terraform version in .terraform-version (without the wrapper script).

runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ steps.version.outputs.version }}
        # The wrapper changes how output is captured (`terraform output -raw` needs it off).
        terraform_wrapper: false
