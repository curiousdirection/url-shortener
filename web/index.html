<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="release" content="%RELEASE%" />
    <title>URL Shortener</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { max-width: 32rem; margin: 3rem auto; padding: 0 1rem; }
      label { display: block; margin-top: 1rem; font-weight: 600; }
      input { width: 100%; box-sizing: border-box; padding: 0.5rem; font: inherit; }
      button { margin-top: 1rem; padding: 0.5rem 1rem; font: inherit; }
      .error { color: #b00020; }
      .result { margin-top: 1.5rem; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
      .result a { word-break: break-all; }
      [hidden] { display: none; }
    </style>
  </head>
  <body>
    <h1>URL Shortener</h1>
    <form id="form" novalidate>
      <label for="url">URL</label>
      <input id="url" name="url" type="url" placeholder="https://example.com/a/long/path" required />
      <label for="alias">Alias (optional)</label>
      <input id="alias" name="alias" type="text" placeholder="my-link" autocomplete="off" />
      <button id="submit" type="submit">Shorten</button>
    </form>
    <p id="error" class="error" role="alert" hidden></p>
    <div id="result" class="result" hidden>
      <a id="short-url" href="" target="_blank" rel="noopener"></a>
      <button id="copy" type="button">Copy</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
